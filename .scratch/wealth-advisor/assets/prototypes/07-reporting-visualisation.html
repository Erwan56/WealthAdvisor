<title>Reporting du patrimoine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#EDEBE2;
    --surface:#FFFFFF;
    --surface-2:#F7F5EC;
    --ink:#20261F;
    --muted:#6E6858;
    --line:#CFC6AC;
    --line-strong:#B8AD8C;
    --accent:#96601F;
    --accent-ink:#FFF8ED;
    --good:#3F6C4A;
    --bad:#A8483B;
    --focus:#96601F;
    --shadow: 0 1px 2px rgba(32,38,31,0.06), 0 8px 24px -12px rgba(32,38,31,0.18);
    --s1:#5B8DBE; --s2:#C97A3D; --s3:#6E9C5A; --s4:#A16BB0; --s5:#C7A32E; --s6:#4FA3A3;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#171A15; --surface:#20241D; --surface-2:#262B21; --ink:#EDE8DA; --muted:#A79E88;
      --line:#3A3E31; --line-strong:#4B5040; --accent:#D0964A; --accent-ink:#20150A;
      --good:#7FBB8B; --bad:#E08A7D; --focus:#D0964A;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --ground:#171A15; --surface:#20241D; --surface-2:#262B21; --ink:#EDE8DA; --muted:#A79E88;
    --line:#3A3E31; --line-strong:#4B5040; --accent:#D0964A; --accent-ink:#20150A;
    --good:#7FBB8B; --bad:#E08A7D; --focus:#D0964A;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
  }

  *{ box-sizing:border-box; }
  body{ background:var(--ground); color:var(--ink); font-family:'Public Sans', -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.display{ font-family:'Fraunces', Georgia, serif; text-wrap:balance; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  .scaffold{ display:flex; flex-direction:column; min-height:100vh; }

  .proto-banner{
    background:var(--ink); color:var(--ground); font-family:'IBM Plex Mono', monospace;
    font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; padding:7px 20px;
    display:flex; justify-content:space-between; gap:12px;
  }
  .proto-banner b{ color:var(--accent-ink); background:var(--accent); padding:1px 6px; border-radius:3px; margin-right:8px; }

  .app-header{ padding:28px 32px 0; max-width:1100px; margin:0 auto; width:100%; }
  .eyebrow{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .app-header h1{ font-size:28px; font-weight:500; margin:4px 0 20px; }

  main{ flex:1; max-width:1100px; margin:0 auto; width:100%; padding:0 32px 140px; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); }
  .btn{
    font-family:'Public Sans'; font-size:13px; font-weight:600; border-radius:7px; padding:8px 14px;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .segmented{ display:inline-flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; }
  .segmented button{ font-family:'Public Sans'; font-size:12.5px; font-weight:600; padding:7px 13px; border:none; background:var(--surface); color:var(--muted); cursor:pointer; }
  .segmented button + button{ border-left:1px solid var(--line-strong); }
  .segmented button.active{ background:var(--accent); color:var(--accent-ink); }
  .chip{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:5px 11px 5px 8px;
    border-radius:999px; border:1px solid var(--line-strong); background:var(--surface); cursor:pointer; color:var(--muted);
  }
  .chip .dot{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .chip.active{ color:var(--ink); border-color:var(--line-strong); background:var(--surface-2); }
  .chip.off{ opacity:.4; }

  /* ============ VARIANT A — synthèse chiffrée ============ */
  .kpi-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:20px 0 18px; }
  .kpi-card{ padding:18px 20px; }
  .kpi-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; }
  .kpi-value{ font-family:'Fraunces'; font-size:26px; margin-top:6px; }
  .kpi-delta{ font-size:12.5px; margin-top:4px; font-family:'IBM Plex Mono'; }
  .kpi-delta.up{ color:var(--good); } .kpi-delta.down{ color:var(--bad); }

  .a-body{ display:grid; grid-template-columns:220px 1fr; gap:20px; padding:22px; }
  .a-donut-wrap{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .a-donut-total{ font-family:'IBM Plex Mono'; font-size:12px; color:var(--muted); text-align:center; }

  table.ledger{ width:100%; border-collapse:collapse; }
  table.ledger th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; padding:6px 10px; border-bottom:1px solid var(--line-strong); }
  table.ledger td{ padding:9px 10px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  table.ledger tr:last-child td{ border-bottom:none; }
  table.ledger tr{ cursor:pointer; }
  table.ledger tr.hl{ background:var(--surface-2); }
  table.ledger td.num{ font-family:'IBM Plex Mono'; text-align:right; }
  table.ledger td .dname{ display:flex; align-items:center; gap:8px; font-weight:600; }
  table.ledger td .metric{ font-size:12px; color:var(--muted); }
  table.ledger td .spark{ width:70px; display:block; }

  /* ============ VARIANT B — courbe temporelle ============ */
  .b-toolbar{ display:flex; justify-content:space-between; align-items:center; gap:14px; padding:18px 22px 0; flex-wrap:wrap; }
  .b-chart-wrap{ padding:10px 22px 4px; }
  .b-net-toggle{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); font-weight:600; }
  .b-legend{ display:flex; gap:8px; flex-wrap:wrap; padding:14px 22px 6px; }
  .b-stackbar-wrap{ padding:4px 22px 20px; }
  .b-stackbar-label{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; margin-bottom:8px; }
  .b-detail{ margin:0 22px 20px; padding:14px 16px; border:1px dashed var(--line-strong); border-radius:8px; }
  .b-detail-title{ font-weight:600; font-size:13.5px; margin-bottom:2px; }
  .b-detail-metric{ font-family:'IBM Plex Mono'; color:var(--accent); font-size:15px; }
  .axis-labels{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted); font-family:'IBM Plex Mono'; padding:2px 22px 0; }

  /* ============ VARIANT C — fiches par domaine ============ */
  .c-topbar{ display:flex; gap:28px; align-items:baseline; padding:16px 22px; border-bottom:1px solid var(--line); }
  .c-topbar .tv-label{ font-size:11px; text-transform:uppercase; color:var(--muted); letter-spacing:.05em; font-weight:600; }
  .c-topbar .tv-value{ font-family:'IBM Plex Mono'; font-size:17px; }
  .c-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding:20px 22px; }
  .c-card{ border:1.5px solid var(--line); border-radius:10px; padding:16px; cursor:pointer; background:var(--surface); text-align:left; }
  .c-card:hover{ border-color:var(--accent); }
  .c-card.selected{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 7%, var(--surface)); }
  .c-card-head{ display:flex; align-items:center; gap:8px; font-weight:600; font-size:13.5px; margin-bottom:6px; }
  .c-card .dot{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
  .c-card-value{ font-family:'Fraunces'; font-size:20px; margin-bottom:8px; }
  .c-card-metric{ font-size:11.5px; color:var(--muted); border-top:1px solid var(--line); padding-top:8px; margin-top:4px; }
  .c-card-metric b{ color:var(--ink); font-family:'IBM Plex Mono'; font-weight:600; }
  .c-detail{ margin:0 22px 22px; border:1px solid var(--line-strong); border-radius:10px; padding:18px 20px; background:var(--surface-2); }
  .c-detail-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .c-detail-title{ font-family:'Fraunces'; font-size:19px; }
  .c-detail-stats{ display:flex; gap:22px; margin-top:12px; flex-wrap:wrap; }
  .c-detail-stat{ font-size:12px; color:var(--muted); }
  .c-detail-stat b{ display:block; font-family:'IBM Plex Mono'; font-size:15px; color:var(--ink); font-weight:600; }

  /* ---------- Switcher ---------- */
  .switcher{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:2px;
    background:var(--ink); color:var(--ground); border-radius:999px; padding:5px; box-shadow:0 10px 30px -8px rgba(0,0,0,0.4); z-index:50; }
  .switcher button{ background:none; border:none; color:var(--ground); width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; }
  .switcher button:hover{ background:rgba(255,255,255,0.12); }
  .switcher .label{ font-family:'IBM Plex Mono'; font-size:12px; padding:0 14px; min-width:220px; text-align:center; }
  .switcher .label b{ color:var(--accent); }
  [hidden]{ display:none !important; }
</style>

<div class="scaffold">
  <div class="proto-banner">
    <span><b>PROTOTYPE</b>Reporting et visualisation du patrimoine — ticket wayfinder 07</span>
    <span id="variant-hint"></span>
  </div>
  <div id="app"></div>
</div>

<div class="switcher" id="switcher">
  <button id="prev" aria-label="Variante précédente">‹</button>
  <div class="label" id="switch-label"></div>
  <button id="next" aria-label="Variante suivante">›</button>
</div>

<script>
/* ---------------- deterministic pseudo-random ---------------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function genSeries(final, points, seed, vol){
  const rand = mulberry32(seed);
  const vals = [final]; let v = final;
  for(let i=1;i<points;i++){
    const step = (rand()-0.42) * vol * v;
    v = Math.max(final*0.05, v - step);
    vals.push(v);
  }
  return vals.reverse();
}
function genLinear(from, to, points){
  const vals=[]; for(let i=0;i<points;i++) vals.push(from + (to-from)*(i/(points-1)));
  return vals;
}
const MONTHS = ['Sep 24','Oct','Nov','Déc','Jan 25','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep 25'];

/* ---------------- domain data ---------------- */
const DOMAINS = {
  liquidites:{ label:'Liquidités', color:'var(--s1)', value:18400, metricLabel:null, metricValue:null,
    series:genSeries(18400,13,11,0.02) },
  bourse:{ label:'Bourse (PEA/CTO)', color:'var(--s2)', value:58200, metricLabel:'Plus-value latente', metricValue:'+9 800 €',
    series:genSeries(58200,13,22,0.07) },
  immobilier:{ label:'Immobilier', color:'var(--s3)', value:408000, metricLabel:'Rendement locatif net', metricValue:'5,3 %',
    series:genSeries(408000,13,33,0.012), debtSeries:genLinear(260000,225000,13),
    detail:{ 'Loyers perçus (mensuel)':'650 €', 'Charges + gestion':'120 €', 'Mensualité prêt':'420 €', 'Cash-flow net mensuel':'+15 €' } },
  av_per:{ label:'Assurance-vie / PER', color:'var(--s4)', value:53300, metricLabel:'Ancienneté fiscale', metricValue:'8 ans (abattement acquis)',
    series:genSeries(53300,13,44,0.02) },
  crypto:{ label:'Crypto', color:'var(--s5)', value:15700, metricLabel:'Plus-value latente', metricValue:'+2 100 €',
    series:genSeries(15700,13,55,0.16) },
  pe_scpi:{ label:'Private equity / SCPI', color:'var(--s6)', value:18900, metricLabel:'Durée de blocage restante', metricValue:'4 ans',
    series:genSeries(18900,13,66,0.01) },
};
const DOMAIN_KEYS = Object.keys(DOMAINS);
const N = 13;
const totalSeries = Array.from({length:N},(_,i)=>DOMAIN_KEYS.reduce((s,k)=>s+DOMAINS[k].series[i],0));
const debtSeries = DOMAINS.immobilier.debtSeries;
const netSeries = totalSeries.map((v,i)=>v-debtSeries[i]);
const totalNow = totalSeries[N-1], netNow = netSeries[N-1];
const deltaTotal = totalNow - totalSeries[N-2];

function fmtEUR(v){ return Math.round(v).toLocaleString('fr-FR') + ' €'; }
function fmtDelta(v){ return (v>=0?'+':'') + Math.round(v).toLocaleString('fr-FR') + ' €'; }

/* ---------------- SVG chart helpers ---------------- */
function svgLine(seriesList, w, h, opts={}){
  const allVals = seriesList.flatMap(s=>s.values);
  const max = Math.max(...allVals) * 1.06;
  const min = opts.zeroBase ? 0 : Math.min(...allVals) * 0.94;
  const n = seriesList[0].values.length;
  const stepX = w/(n-1);
  const pt = (i,v) => [i*stepX, h - ((v-min)/(max-min||1))*h];
  let svg = '';
  seriesList.forEach(s=>{
    const pts = s.values.map((v,i)=>pt(i,v));
    const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    if(opts.area){
      const areaPath = path + ` L${pts[pts.length-1][0].toFixed(1)},${h} L0,${h} Z`;
      svg += `<path d="${areaPath}" fill="${s.color}" fill-opacity="0.14" stroke="none"/>`;
    }
    svg += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="${s.width||2}" stroke-dasharray="${s.dashed?'4 3':'none'}" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="overflow:visible;display:block">${svg}</svg>`;
}
function svgDonut(data, size, thickness){
  const total = data.reduce((s,d)=>s+d.value,0);
  const r = size/2 - thickness/2, cx=size/2, cy=size/2, circ=2*Math.PI*r;
  let acc=0;
  const segs = data.map(d=>{
    const frac = d.value/total, dash = frac*circ, gap = circ-dash;
    const rotate = (acc/total)*360 - 90; acc += d.value;
    return `<circle data-k="${d.key}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${d.hl?thickness+4:thickness}" stroke-dasharray="${dash.toFixed(1)} ${gap.toFixed(1)}" transform="rotate(${rotate} ${cx} ${cy})" style="transition:stroke-width .12s"/>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${segs}</svg>`;
}
function svgStackedBar(data, w, h){
  const total = data.reduce((s,d)=>s+d.value,0);
  let x=0;
  const segs = data.map(d=>{
    const width=(d.value/total)*w;
    const r = `<rect x="${x.toFixed(1)}" y="0" width="${Math.max(width-1,0).toFixed(1)}" height="${h}" fill="${d.color}" rx="2"/>`;
    x+=width; return r;
  }).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">${segs}</svg>`;
}
function resolveColor(v){ // resolve var(--sN) to a concrete hex for SVG stroke-in-string contexts (not needed, CSS vars work in SVG attrs via style, but attribute stroke doesn't take var() reliably in all cases) — keep as-is, modern browsers support var() in presentation attributes.
  return v;
}

/* ================================================================== */
/* VARIANT A — synthèse chiffrée (KPI + donut + table)                 */
/* ================================================================== */
const StateA = { hl:null };
function renderA(){
  const donutData = DOMAIN_KEYS.map(k=>({key:k, value:DOMAINS[k].value, color:DOMAINS[k].color, hl:StateA.hl===k}));
  const rows = DOMAIN_KEYS.map(k=>{
    const d = DOMAINS[k];
    const pct = (d.value/totalNow*100).toFixed(1);
    const rowDelta = d.series[N-1]-d.series[N-2];
    return `<tr data-k="${k}" class="${StateA.hl===k?'hl':''}">
      <td><div class="dname"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:${d.color};display:inline-block"></span>${d.label}</div></td>
      <td class="num">${fmtEUR(d.value)}</td>
      <td class="num">${pct}%</td>
      <td class="num" style="color:${rowDelta>=0?'var(--good)':'var(--bad)'}">${fmtDelta(rowDelta)}</td>
      <td><span class="spark">${svgLine([{values:d.series,color:d.color,width:1.5}],70,26)}</span></td>
      <td><span class="metric">${d.metricLabel ? d.metricLabel+' : '+d.metricValue : '—'}</span></td>
    </tr>`;
  }).join('');
  return `
    <div class="kpi-row">
      <div class="card kpi-card"><div class="kpi-label">Patrimoine total</div><div class="kpi-value mono">${fmtEUR(totalNow)}</div>
        <div class="kpi-delta ${deltaTotal>=0?'up':'down'}">${fmtDelta(deltaTotal)} depuis la dernière mise à jour</div></div>
      <div class="card kpi-card"><div class="kpi-label">Patrimoine net</div><div class="kpi-value mono">${fmtEUR(netNow)}</div>
        <div class="kpi-delta" style="color:var(--muted)">après déduction du capital restant dû (${fmtEUR(debtSeries[N-1])})</div></div>
      <div class="card kpi-card"><div class="kpi-label">Domaines suivis</div><div class="kpi-value mono">${DOMAIN_KEYS.length}</div>
        <div class="kpi-delta" style="color:var(--muted)">dernière mise à jour : Sep 2025</div></div>
    </div>
    <div class="card">
      <div class="a-body">
        <div class="a-donut-wrap">
          <div id="a-donut">${svgDonut(donutData,190,30)}</div>
          <div class="a-donut-total">Répartition du<br>patrimoine total</div>
        </div>
        <div>
          <table class="ledger">
            <thead><tr><th>Domaine</th><th style="text-align:right">Valeur</th><th style="text-align:right">Part</th><th style="text-align:right">Variation</th><th>Historique</th><th>Indicateur clé</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}
function wireA(root){
  root.querySelectorAll('table.ledger tbody tr').forEach(tr=>tr.addEventListener('click',()=>{
    StateA.hl = StateA.hl===tr.dataset.k ? null : tr.dataset.k; paint();
  }));
}

/* ================================================================== */
/* VARIANT B — courbe temporelle centrale                              */
/* ================================================================== */
const StateB = { granularity:'mensuel', showNet:false, selected:new Set(DOMAIN_KEYS) };
function resample(series, granularity){
  if(granularity==='annuel') return [series[0], series[6], series[12]];
  if(granularity==='saisie') {
    // fake finer granularity by interpolating extra jitter points between months
    const rand = mulberry32(99); const out=[];
    for(let i=0;i<series.length-1;i++){
      out.push(series[i]);
      out.push(series[i] + (series[i+1]-series[i])*0.5 + (rand()-0.5)*series[i]*0.015);
    }
    out.push(series[series.length-1]);
    return out;
  }
  return series; // mensuel = base
}
function renderB(){
  const gTotal = resample(totalSeries, StateB.granularity);
  const gNet = resample(netSeries, StateB.granularity);
  const lines = [{values:gTotal, color:'var(--ink)', width:2.5, area:true}];
  if(StateB.showNet) lines.push({values:gNet, color:'var(--accent)', width:2, dashed:true});

  const domainLines = DOMAIN_KEYS.filter(k=>StateB.selected.has(k) && StateB.selected.size<DOMAIN_KEYS.length)
    .map(k=>({values:resample(DOMAINS[k].series, StateB.granularity), color:DOMAINS[k].color, width:1.8}));
  const showingOverlay = domainLines.length>0;

  const legend = DOMAIN_KEYS.map(k=>{
    const on = StateB.selected.has(k);
    return `<button class="chip ${on?'active':'off'}" data-k="${k}"><span class="dot" style="background:${DOMAINS[k].color}"></span>${DOMAINS[k].label}</button>`;
  }).join('');

  const barData = DOMAIN_KEYS.map(k=>({value:DOMAINS[k].value, color:DOMAINS[k].color}));

  const soloKey = StateB.selected.size===1 ? [...StateB.selected][0] : null;
  const soloDetail = soloKey && DOMAINS[soloKey].metricLabel ? `
    <div class="b-detail">
      <div class="b-detail-title">${DOMAINS[soloKey].label}</div>
      <div class="b-detail-metric">${DOMAINS[soloKey].metricLabel} : ${DOMAINS[soloKey].metricValue}</div>
    </div>` : '';

  return `
    <div class="card">
      <div class="b-toolbar">
        <div class="segmented" id="b-gran">
          <button data-g="saisie" class="${StateB.granularity==='saisie'?'active':''}">Par mise à jour</button>
          <button data-g="mensuel" class="${StateB.granularity==='mensuel'?'active':''}">Mensuel</button>
          <button data-g="annuel" class="${StateB.granularity==='annuel'?'active':''}">Annuel</button>
        </div>
        <label class="b-net-toggle"><input type="checkbox" id="b-net" ${StateB.showNet?'checked':''}> Afficher le patrimoine net (dettes déduites)</label>
      </div>
      <div class="b-chart-wrap">${svgLine(showingOverlay?domainLines:lines,760,240,{area:!showingOverlay})}</div>
      <div class="axis-labels"><span>${MONTHS[0]}</span><span>${MONTHS[MONTHS.length-1]}</span></div>
      <div class="b-legend">${legend}</div>
      ${soloDetail}
      <div class="b-stackbar-wrap">
        <div class="b-stackbar-label">Répartition actuelle par domaine</div>
        ${svgStackedBar(barData,760,22)}
      </div>
    </div>
  `;
}
function wireB(root){
  root.querySelector('#b-gran').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ StateB.granularity=b.dataset.g; paint(); }));
  root.querySelector('#b-net').addEventListener('change',(e)=>{ StateB.showNet=e.target.checked; paint(); });
  root.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
    const k = c.dataset.k;
    if(StateB.selected.has(k) && StateB.selected.size===1){ StateB.selected = new Set(DOMAIN_KEYS); }
    else { StateB.selected = new Set([k]); }
    paint();
  }));
}

/* ================================================================== */
/* VARIANT C — fiches par domaine                                      */
/* ================================================================== */
const StateC = { selected:'immobilier' };
function renderC(){
  const cards = DOMAIN_KEYS.map(k=>{
    const d = DOMAINS[k];
    return `<button class="c-card ${StateC.selected===k?'selected':''}" data-k="${k}">
      <div class="c-card-head"><span class="dot" style="background:${d.color}"></span>${d.label}</div>
      <div class="c-card-value mono">${fmtEUR(d.value)}</div>
      ${svgLine([{values:d.series,color:d.color,width:1.6}],220,36)}
      <div class="c-card-metric">${d.metricLabel ? `${d.metricLabel} : <b>${d.metricValue}</b>` : 'Pas d’indicateur spécifique'}</div>
    </button>`;
  }).join('');

  const d = DOMAINS[StateC.selected];
  let extraStats = '';
  if(d.detail){
    extraStats = Object.entries(d.detail).map(([l,v])=>`<div class="c-detail-stat">${l}<b>${v}</b></div>`).join('');
  } else if(d.metricLabel){
    extraStats = `<div class="c-detail-stat">${d.metricLabel}<b>${d.metricValue}</b></div>`;
  }
  const detailLines = [{values:d.series,color:d.color,width:2.5,area:true}];
  if(d.debtSeries) detailLines.push({values:d.debtSeries,color:'var(--bad)',width:1.8,dashed:true});

  return `
    <div class="card">
      <div class="c-topbar">
        <div><div class="tv-label">Patrimoine total</div><div class="tv-value mono">${fmtEUR(totalNow)}</div></div>
        <div><div class="tv-label">Patrimoine net</div><div class="tv-value mono">${fmtEUR(netNow)}</div></div>
      </div>
      <div class="c-grid">${cards}</div>
      <div class="c-detail">
        <div class="c-detail-head">
          <div class="c-detail-title">${d.label} — évolution</div>
          <div class="mono" style="font-size:12px;color:var(--muted)">${d.debtSeries?'trait plein = valeur estimée · pointillé = capital restant dû':'12 derniers mois'}</div>
        </div>
        ${svgLine(detailLines,700,180,{area:false})}
        <div class="axis-labels" style="padding:6px 0 0"><span>${MONTHS[0]}</span><span>${MONTHS[MONTHS.length-1]}</span></div>
        <div class="c-detail-stats">${extraStats}</div>
      </div>
    </div>
  `;
}
function wireC(root){
  root.querySelectorAll('.c-card').forEach(c=>c.addEventListener('click',()=>{ StateC.selected=c.dataset.k; paint(); }));
}

/* ---------------- switcher plumbing ---------------- */
const VARIANTS = [
  { key:'A', name:'Synthèse chiffrée', hint:'KPI + donut + tableau, historique en aperçu par ligne', render:renderA, wire:wireA },
  { key:'B', name:'Courbe temporelle', hint:'grand graphe d’évolution, granularité et superposition par domaine', render:renderB, wire:wireB },
  { key:'C', name:'Fiches par domaine', hint:'grille de fiches, détail au clic avec indicateurs spécifiques', render:renderC, wire:wireC },
];
let current = 0;
function paint(){
  const v = VARIANTS[current];
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="app-header">
      <div class="eyebrow">Reporting du patrimoine — variante ${v.key}</div>
      <h1>${v.name}</h1>
    </div>
    <main>${v.render()}</main>
  `;
  v.wire(app);
  document.getElementById('switch-label').innerHTML = `<b>${v.key}</b> ${v.name}`;
  document.getElementById('variant-hint').textContent = `Variante ${v.key} — ${v.hint}`;
}
function go(delta){ current = (current + delta + VARIANTS.length) % VARIANTS.length; paint(); }
document.getElementById('prev').addEventListener('click', ()=>go(-1));
document.getElementById('next').addEventListener('click', ()=>go(1));
document.addEventListener('keydown', (e)=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='textarea' || e.target.isContentEditable) return;
  if(e.key==='ArrowLeft') go(-1);
  if(e.key==='ArrowRight') go(1);
});
paint();
</script>
